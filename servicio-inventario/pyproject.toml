[project]
name = "guardian"
version = "1.0.0"
description = "Servicio de inventario del taller: libro mayor, reservas, faltantes y sugerencias de compra"
requires-python = ">=3.12,<3.14"  # confluent-kafka aún no publica ruedas para 3.14
dependencies = [
    "confluent-kafka==2.6.1",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "psycopg[binary]==3.2.3",
    "psycopg-pool==3.2.4",
    "jsonschema==4.23.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[project.scripts]
guardian = "guardian.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["guardian*"]
